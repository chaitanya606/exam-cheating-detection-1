global:
  output_path: "./recordings"

video:
  source: 0
  resolution: [480, 640]
  fps: 30
  recording_path: "./recordings"

screen:
  monitor_index: 0
  fps: 15
  recording: true

detection:
  face:
    detection_interval: 5
    min_confidence: 0.8
  eyes:
    gaze_threshold: 2
    blink_threshold: 0.3
    gaze_sensitivity: 15
    consecutive_frames: 3
  mouth:
    movement_threshold: 3
  multi_face:
    alert_threshold: 5
  objects:
    min_confidence: 0.65
    detection_interval: 5
    max_fps: 5
  audio_monitoring:
    enabled: false
    sample_rate: 16000
    energy_threshold: 0.001
    zcr_threshold: 0.35
    whisper_enabled: false
    whisper_model: "tiny.en"

logging:
  log_path: "./logs"
  alert_cooldown: 10
  alert_system:
    voice_alerts: false
    alert_volume: 0.8
    cooldown: 10

violation:
  save_path: "./violations"
