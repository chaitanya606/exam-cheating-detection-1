<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proctoring Test Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            margin-bottom: 20px;
            color: #00d9ff;
        }
        
        .status {
            background: #16213e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #666;
        }
        
        .status-dot.connected {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }
        
        .status-dot.error {
            background: #ff4444;
            box-shadow: 0 0 10px #ff4444;
        }
        
        .video-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .video-container {
            background: #16213e;
            border-radius: 8px;
            padding: 15px;
        }
        
        .video-container h3 {
            margin-bottom: 10px;
            color: #00d9ff;
        }
        
        video {
            width: 100%;
            border-radius: 4px;
            background: #000;
        }
        
        .violations {
            background: #16213e;
            border-radius: 8px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .violations h2 {
            margin-bottom: 15px;
            color: #00d9ff;
        }
        
        .violation-item {
            background: #0f3460;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 10px;
            border-left: 4px solid #ff4444;
        }
        
        .violation-item.warning {
            border-left-color: #ffaa00;
        }
        
        .violation-item.info {
            border-left-color: #00d9ff;
        }
        
        .violation-type {
            font-weight: bold;
            color: #ff4444;
            margin-bottom: 5px;
        }
        
        .violation-time {
            font-size: 12px;
            color: #888;
        }
        
        .violation-details {
            font-size: 13px;
            color: #ccc;
            margin-top: 5px;
        }
        
        .controls {
            background: #16213e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        
        button {
            background: #00d9ff;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        button:hover {
            background: #00b8d4;
            transform: translateY(-1px);
        }
        
        button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }
        
        .stats {
            background: #16213e;
            padding: 15px;
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #00d9ff;
        }
        
        .stat-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 AI Proctoring Test Client</h1>
        
        <div class="status">
            <div class="status-item">
                <div class="status-dot" id="webrtcDot"></div>
                <span id="webrtcStatus">WebRTC: Disconnected</span>
            </div>
            <div class="status-item">
                <div class="status-dot" id="dataDot"></div>
                <span id="dataStatus">DataChannel: Closed</span>
            </div>
            <div class="status-item">
                <span id="serverStatus">Server: Checking...</span>
            </div>
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="violationCount">0</div>
                <div class="stat-label">Total Violations</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="frameCount">0</div>
                <div class="stat-label">Frames Processed</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="detectorStatus">Unknown</div>
                <div class="stat-label">Detector Status</div>
            </div>
        </div>
        
        <div class="controls">
            <button id="startBtn">Start Proctoring</button>
            <button id="stopBtn" disabled>Stop Proctoring</button>
            <button id="clearBtn">Clear Violations</button>
        </div>
        
        <div class="video-grid">
            <div class="video-container">
                <h3>📷 Camera Feed</h3>
                <video id="cameraVideo" autoplay playsinline muted></video>
            </div>
            <div class="video-container">
                <h3>🖥️ Screen Share</h3>
                <video id="screenVideo" autoplay playsinline muted></video>
            </div>
        </div>
        
        <div class="violations">
            <h2>🚨 Violations Log</h2>
            <div id="violationsList"></div>
        </div>
    </div>

    <script>
        let pc = null;
        let dataChannel = null;
        let cameraStream = null;
        let screenStream = null;
        let violationCount = 0;
        let frameCount = 0;

        const elements = {
            webrtcDot: document.getElementById('webrtcDot'),
            dataDot: document.getElementById('dataDot'),
            webrtcStatus: document.getElementById('webrtcStatus'),
            dataStatus: document.getElementById('dataStatus'),
            serverStatus: document.getElementById('serverStatus'),
            violationCount: document.getElementById('violationCount'),
            frameCount: document.getElementById('frameCount'),
            detectorStatus: document.getElementById('detectorStatus'),
            startBtn: document.getElementById('startBtn'),
            stopBtn: document.getElementById('stopBtn'),
            clearBtn: document.getElementById('clearBtn'),
            cameraVideo: document.getElementById('cameraVideo'),
            screenVideo: document.getElementById('screenVideo'),
            violationsList: document.getElementById('violationsList')
        };

        // Check server status
        async function checkServerStatus() {
            try {
                const response = await fetch('/status');
                const data = await response.json();
                elements.serverStatus.textContent = 
                    `Server: ${data.status} | Detectors: ${data.detectors_available ? '✓' : '✗'}`;
                elements.detectorStatus.textContent = 
                    data.detectors_available ? '✓ Active' : '✗ Stub';
            } catch (error) {
                elements.serverStatus.textContent = 'Server: Error';
                elements.detectorStatus.textContent = '✗ Error';
            }
        }

        // Add violation to log
        function addViolation(violation, timestamp, details) {
            violationCount++;
            elements.violationCount.textContent = violationCount;

            const item = document.createElement('div');
            item.className = 'violation-item';
            
            const violationNames = {
                'FACE_DISAPPEARED': '👤 Face Disappeared',
                'GAZE_AWAY': '👀 Looking Away',
                'MOUTH_MOVING': '🗣️ Talking Detected',
                'MULTIPLE_FACES': '👥 Multiple People',
                'OBJECT_DETECTED': '📱 Suspicious Object',
                'WINDOW_SWITCH': '🔄 Window Switched'
            };

            item.innerHTML = `
                <div class="violation-type">${violationNames[violation] || violation}</div>
                <div class="violation-time">${new Date(timestamp).toLocaleTimeString()}</div>
                ${details ? `<div class="violation-details">${JSON.stringify(details, null, 2)}</div>` : ''}
            `;

            elements.violationsList.insertBefore(item, elements.violationsList.firstChild);

            // Play alert sound (optional)
            const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBTGH0fPTgjMGHm7A7+OZUQ0');
            audio.volume = 0.3;
            audio.play().catch(() => {});
        }

        // Start proctoring
        async function start() {
            try {
                // Get camera
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480 },
                    audio: false
                });
                elements.cameraVideo.srcObject = cameraStream;

                // Get screen
                screenStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { width: 1920, height: 1080 },
                    audio: false
                });
                elements.screenVideo.srcObject = screenStream;

                // Create RTCPeerConnection
                pc = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                });

                // Create DataChannel
                dataChannel = pc.createDataChannel('violations');
                
                dataChannel.onopen = () => {
                    console.log('DataChannel opened');
                    elements.dataDot.classList.add('connected');
                    elements.dataStatus.textContent = 'DataChannel: Open';
                };

                dataChannel.onclose = () => {
                    console.log('DataChannel closed');
                    elements.dataDot.classList.remove('connected');
                    elements.dataStatus.textContent = 'DataChannel: Closed';
                };

                dataChannel.onmessage = (event) => {
                    console.log('Received:', event.data);
                    try {
                        const data = JSON.parse(event.data);
                        if (data.type === 'VIOLATION') {
                            addViolation(data.violation, data.timestamp, data.details);
                        }
                    } catch (error) {
                        console.error('Failed to parse message:', error);
                    }
                };

                // Add tracks
                cameraStream.getTracks().forEach(track => pc.addTrack(track, cameraStream));
                screenStream.getTracks().forEach(track => pc.addTrack(track, screenStream));

                // Connection state
                pc.onconnectionstatechange = () => {
                    console.log('Connection state:', pc.connectionState);
                    elements.webrtcStatus.textContent = `WebRTC: ${pc.connectionState}`;
                    
                    if (pc.connectionState === 'connected') {
                        elements.webrtcDot.classList.add('connected');
                    } else {
                        elements.webrtcDot.classList.remove('connected');
                    }

                    if (pc.connectionState === 'failed' || pc.connectionState === 'closed') {
                        elements.webrtcDot.classList.add('error');
                    }
                };

                // Create offer
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                // Send to server
                const response = await fetch('/offer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sdp: pc.localDescription.sdp,
                        type: pc.localDescription.type
                    })
                });

                const answer = await response.json();
                await pc.setRemoteDescription(answer);

                elements.startBtn.disabled = true;
                elements.stopBtn.disabled = false;

                // Simulate frame counting
                setInterval(() => {
                    if (pc && pc.connectionState === 'connected') {
                        frameCount++;
                        elements.frameCount.textContent = frameCount;
                    }
                }, 100);

            } catch (error) {
                console.error('Failed to start:', error);
                alert('Failed to start proctoring: ' + error.message);
            }
        }

        // Stop proctoring
        function stop() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
            }
            if (screenStream) {
                screenStream.getTracks().forEach(track => track.stop());
            }
            if (pc) {
                pc.close();
            }

            elements.cameraVideo.srcObject = null;
            elements.screenVideo.srcObject = null;
            elements.startBtn.disabled = false;
            elements.stopBtn.disabled = true;
            elements.webrtcDot.classList.remove('connected', 'error');
            elements.dataDot.classList.remove('connected');
        }

        // Event listeners
        elements.startBtn.addEventListener('click', start);
        elements.stopBtn.addEventListener('click', stop);
        elements.clearBtn.addEventListener('click', () => {
            elements.violationsList.innerHTML = '';
            violationCount = 0;
            elements.violationCount.textContent = '0';
        });

        // Check server status on load
        checkServerStatus();
        setInterval(checkServerStatus, 5000);
    </script>
</body>
</html>
